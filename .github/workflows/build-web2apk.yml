name: Build Web2APK

run-name: Web2APK ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique build ID"
        required: true
        type: string
      website_url:
        description: "Website URL"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        type: string
      package_name:
        description: "Package name"
        required: true
        type: string
      version_name:
        description: "Version name"
        required: true
        default: "1.0"
        type: string
      config:
        description: "Web2APK settings JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Prepare build config
        env:
          JOB_ID: ${{ inputs.job_id }}
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          CONFIG_JSON: ${{ inputs.config }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const e = process.env;
          let config = {};
          try { config = JSON.parse(e.CONFIG_JSON || '{}'); }
          catch (err) { console.error('Invalid config JSON:', err.message); process.exit(1); }
          fs.writeFileSync('build-input.json', JSON.stringify({
            jobId:e.JOB_ID,
            url:e.WEBSITE_URL,
            appName:e.APP_NAME,
            packageName:e.PACKAGE_NAME,
            versionName:e.VERSION_NAME,
            ...config
          }, null, 2));
          NODE

      - name: Prepare Android project
        run: node backend/github-build.mjs build-input.json

      - name: Build APK
        run: |
          cd "backend/work/${{ inputs.job_id }}/project"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          APK=$(find backend/work -type f -name "app-debug.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" "release/Web2APK-${{ inputs.job_id }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="web2apk-${{ inputs.job_id }}"
          gh release create "$TAG" "release/Web2APK-${{ inputs.job_id }}.apk" \
            --title "Web2APK ${{ inputs.job_id }}" \
            --notes "Generated Web2APK APK."
